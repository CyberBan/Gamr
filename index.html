<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Для Арины ♡</title>
<style>
*{box-sizing:border-box}
:root{--pink:#ff5eaa;--dark:#74244f;--pale:#fff0f7;--gold:#ffe09a}
body{margin:0;min-height:100vh;background:linear-gradient(145deg,#ffd1e7,#fff0f7 45%,#f5c7ff);font-family:system-ui,sans-serif;color:#743052;display:flex;align-items:center;justify-content:center;padding:12px;overflow-x:hidden}
#app{width:min(760px,100%);background:#fff9fc;border:2px solid #ffacd1;border-radius:27px;overflow:hidden;box-shadow:0 18px 65px #bb478c30}
header{padding:14px;text-align:center;background:linear-gradient(100deg,#ffb8d8,#ffd8eb,#edc8ff);border-bottom:1px solid #ffb3d5}
header h1{font-size:clamp(20px,5vw,26px);margin:0;color:#a72d6c}
main{padding:clamp(15px,4vw,25px)}
.screen{display:none;text-align:center}.screen.active{display:block}
h2{color:#c6377c;font-size:clamp(24px,5vw,34px);margin:5px 0 12px}
p{line-height:1.5;margin:8px 0}
button{font:inherit;font-weight:850;border:0;border-radius:15px;padding:12px 18px;background:linear-gradient(120deg,#ff69ad,#ff91c4);color:white;box-shadow:0 4px 0 #d6478c;cursor:pointer;transition:.15s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #d6478c}
.hero{font-size:64px;filter:drop-shadow(0 6px 6px #ef87b655);animation:float 2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(2deg)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
#arena{background:linear-gradient(#ffe3f1,#f8b4d8 65%,#d981b2);border:2px solid #f39bc6;border-radius:20px;overflow:hidden;position:relative;margin-bottom:10px}
canvas{width:100%;height:auto;display:block;touch-action:manipulation}
.hud{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px;text-align:left}
.label{display:flex;justify-content:space-between;font-size:12px;font-weight:850;gap:5px;margin-bottom:4px}
.bar{height:12px;border-radius:99px;background:#f4d7e6;border:1px solid #edbad2;overflow:hidden}
.fill{height:100%;transition:width .2s}
#playerBar{background:linear-gradient(90deg,#ff77ae,#ffb2d2)}
#bossBar{background:linear-gradient(90deg,#f25a7d,#ffb25d)}
#message{height:24px;font-weight:800;color:#b22f70;font-size:14px;margin-bottom:8px}
.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.controls button{flex:1;min-width:70px;padding:11px 6px}
.controls .attack{background:linear-gradient(120deg,#f4a52d,#ffcf76);box-shadow:0 4px 0 #c88b2b;color:#733a30}
.controls .special{background:linear-gradient(120deg,#bf72f5,#e6a5ff);box-shadow:0 4px 0 #9b58c9}
.invite{background:linear-gradient(150deg,#fff0f8,#ffe0f0);border:2px dashed #f47bb3;border-radius:20px;padding:18px;margin:15px 0;animation:pop .5s}
.time{font-size:38px;font-weight:950;color:#bc3479}
.secret{font-weight:900;color:#c43e7e}
.heart{position:fixed;bottom:-35px;pointer-events:none;animation:rise 5s linear forwards;z-index:3}
@keyframes rise{to{transform:translateY(-110vh) rotate(35deg);opacity:0}}
</style>
</head>
<body>
<div id="app">
<header>
<h1>♡ Секрет для Арины ♡</h1>
</header>
<main>
<section id="intro" class="screen active">
<div class="hero">💌</div>
<h2>Привет, любимая!</h2>
<p>Победи трёх боссов, чтобы узнать наш план на годовщину ❤️</p>
<button onclick="start()">Начать бой ♡</button>
</section>

<section id="battle" class="screen">
<h2 id="bossTitle">Босс</h2>
<div class="hud">
<div><div class="label"><span>Арина</span><span id="pt">100</span></div><div class="bar"><div id="playerBar" class="fill" style="width:100%"></div></div></div>
<div><div class="label"><span id="bossNameLabel">Босс</span><span id="bt">100</span></div><div class="bar"><div id="bossBar" class="fill" style="width:100%"></div></div></div>
</div>
<div id="arena"><canvas id="cv" width="700" height="320"></canvas></div>
<div id="message"></div>
<div class="controls">
<button onclick="move(-1)">◀</button>
<button class="attack" onclick="hit()">⚔ Удар</button>
<button onclick="move(1)">▶</button>
<button class="special" onclick="special()">💖 (<span id="enCount">0</span>/2)</button>
<button onclick="dodge()">✨ Уклон</button>
</div>
</section>

<section id="victory" class="screen">
<div class="hero">🏆💗</div>
<h2>Победа!</h2>
<div class="invite">
<div class="secret">♡ НАШ ПЛАН ♡</div>
<div class="time">18:00</div>
<p>📍 <b>м. Лиговский проспект</b><br>🎀 <b>Дресс-код: милый</b></p>
</div>
<button onclick="hearts()">Обнять 💗</button>
</section>

<section id="defeat" class="screen">
<div class="hero">🥺💔</div>
<h2>Почти получилось!</h2>
<p>Давай еще раз?</p>
<button onclick="start()">Реванш 💖</button>
</section>
</main>
</div>
<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),c=cv.getContext('2d');

let hp,bossMaxHp,boss,x,baseX,energy,guard,locked,shake,particles=[],floatingTexts=[],animTime=0,isAnimating=0;
let currentBossIndex=0;

const bosses = [
  { name: 'Айро-Гриль', maxHp: 80 },
  { name: 'Злой Арбуз', maxHp: 100 },
  { name: 'Денис', maxHp: 120 }
];

function screen(s){document.querySelectorAll('.screen').forEach(e=>e.classList.remove('active'));$(s).classList.add('active')}

function start(){
  currentBossIndex = 0;
  hp=100;
  loadBoss();
  x=150;baseX=150;energy=0;guard=false;locked=false;shake=0;particles=[];floatingTexts=[];
  screen('battle');
  say('');
  loop();
}

function loadBoss(){
  let b = bosses[currentBossIndex];
  bossMaxHp = b.maxHp;
  boss = b.maxHp;
  $('bossTitle').textContent = `Босс ${currentBossIndex + 1}/3: ${b.name}`;
  $('bossNameLabel').textContent = b.name;
  update();
}

function say(s){$('message').textContent=s}
function update(){
  $('pt').textContent=hp;
  $('bt').textContent=Math.max(0,boss);$('enCount').textContent=energy;
  $('playerBar').style.width=Math.max(0,hp)+'\%';$('bossBar').style.width=Math.max(0,boss/bossMaxHp*100)+'%';
}

function move(d){
  if(locked||isAnimating)return;
  baseX=Math.max(70,Math.min(330,baseX+d*40));
  x=baseX;
}

function addParticles(px,py,symbol,n=10){
  for(let i=0;i<n;i++) particles.push({x:px,y:py,vx:(Math.random()-.5)*6,vy:-Math.random()*5-1,life:40,s:symbol});
}

function addFloatingText(text,px,py,color='#ff3388'){
  floatingTexts.push({text,x:px,y:py,life:30,color});
}

function animateAttack(targetX, onHit){
  isAnimating=true;
  let startX=x, progress=0;
  function step(){
    progress+=0.15;
    if(progress<1){
      x=startX+(targetX-startX)*Math.sin(progress*Math.PI/2);
      requestAnimationFrame(step);
    } else {
      x=targetX;
      onHit();
      let backProgress=0;
      function backStep(){
        backProgress+=0.12;
        if(backProgress<1){
          x=targetX+(baseX-targetX)*Math.sin(backProgress*Math.PI/2);
          requestAnimationFrame(backStep);
        } else {
          x=baseX;
          isAnimating=false;
          afterPlayer();
        }
      }
      requestAnimationFrame(backStep);
    }
  }
  requestAnimationFrame(step);
}

function hit(){
  if(locked||isAnimating)return;
  let damage=25+Math.floor(Math.random()*8);
  animateAttack(450, ()=>{
    boss=Math.max(0,boss-damage);
    energy=Math.min(2,energy+1);
    shake=5;
    addParticles(520,150,'💖',14);
    addFloatingText('-'+damage, 520, 110, '#ff3366');
  });
}

function special(){
  if(locked||isAnimating)return;
  if(energy<2){say('Копи энергию ударами!');return}
  let damage=50;
  animateAttack(450, ()=>{
    energy=0;
    boss=Math.max(0,boss-damage);
    shake=12;
    addParticles(520,150,'✨',24);
    addFloatingText('СУПЕР! -'+damage, 520, 90, '#bb22ff');
  });
}

function dodge(){
  if(locked||isAnimating)return;
  guard=true;
  energy=Math.min(2,energy+1);
  shake=2;
  addParticles(x,180,'🌀',5);
  say('Уклон!');
  locked=true;
  setTimeout(bossTurn, 500);
}

function afterPlayer(){
  update();
  if(boss<=0){
    currentBossIndex++;
    if(currentBossIndex < bosses.length){
      locked=true;
      say('Победа! Следующий босс...');
      setTimeout(()=>{
        loadBoss();
        hp = Math.min(100, hp + 30);
        update();
        say('');
        locked=false;
      }, 1200);
      return;
    } else {
      finish(true);
      return;
    }
  }
  locked=true;
  setTimeout(bossTurn, 600);
}

function bossTurn(){
  if(boss<=0)return;
  if(guard){
    guard=false;
    addFloatingText('ПРОМАХ', 150, 130, '#33aaee');
    say('Уклонение сработало!');
  } else {
    let damage=6+Math.floor(Math.random()*5);
    hp=Math.max(0,hp-damage);
    shake=6;
    addParticles(x,170,'💥',10);
    addFloatingText('-'+damage, x, 130, '#ff2222');
    say('Босс атакует!');
  }
  update();
  locked=false;
  if(hp<=0) finish(false);
}

function finish(win){
  locked=true;
  setTimeout(()=>{
    if(win){ screen('victory'); hearts(); }
    else { screen('defeat'); }
  }, 500);
}

function hearts(){
  for(let i=0;i<25;i++){
    let e=document.createElement('div');
    e.className='heart';
    e.textContent=['💗','💕','♡','✨'][i%4];
    e.style.left=Math.random()*100+'%';
    e.style.fontSize=(18+Math.random()*22)+'px';
    e.style.animationDuration=(3+Math.random()*3)+'s';
    document.body.appendChild(e);
    setTimeout(()=>e.remove(),6000);
  }
}

function text(s,x,y,size,color){
  c.font='bold '+size+'px system-ui';
  c.textAlign='center';
  c.fillStyle=color;
  c.fillText(s,x,y);
}

function drawBoss(bx, by, type){
  if(type === 0){
    c.fillStyle='#59334e';
    for(let i=0;i<15;i++){ let a=i*Math.PI*2/15; c.beginPath(); c.arc(bx+Math.cos(a)*28,by-45+Math.sin(a)*24,15,0,7); c.fill(); }
    c.fillStyle='#75435c'; c.beginPath(); c.arc(bx,by-45,30,0,7); c.fill();
    c.fillStyle='#d99a78'; c.beginPath(); c.ellipse(bx,by-40,21,25,0,0,7); c.fill();
    c.fillStyle='#ff6d83'; c.beginPath(); c.roundRect(bx-30,by-15,60,55,10); c.fill();
  } else if(type === 1){
    c.fillStyle='#2b9348'; c.beginPath(); c.arc(bx, by-20, 38, 0, Math.PI*2); c.fill();
    c.fillStyle='#132a13';
    c.beginPath(); c.arc(bx, by-20, 38, 0.2, 1.2); c.lineTo(bx, by-20); c.fill();
    c.beginPath(); c.arc(bx, by-20, 38, 2.0, 3.0); c.lineTo(bx, by-20); c.fill();
  } else {
    c.fillStyle='#1d3557'; c.beginPath(); c.arc(bx, by-50, 20, 0, 7); c.fill();
    c.fillStyle='#f1faee'; c.beginPath(); c.ellipse(bx, by-43, 15, 18, 0, 0, 7); c.fill();
    c.fillStyle='#e63946'; c.beginPath(); c.roundRect(bx-28, by-22, 56, 50, 8); c.fill();
  }
}

function draw(){
  animTime+=0.05;
  c.clearRect(0,0,700,320);
  
  let dx=shake?Math.random()*shake-shake/2:0;
  shake=Math.max(0,shake-1);
  
  c.save();
  c.translate(dx,0);
  
  let bgColors = [['#ffe7f4','#e9a1c9'], ['#e2f0d9','#a3e4d7'], ['#d8e2dc','#b5e2fa']];
  let g=c.createLinearGradient(0,0,0,320);
  g.addColorStop(0, bgColors[currentBossIndex][0]); g.addColorStop(1, bgColors[currentBossIndex][1]);
  c.fillStyle=g; c.fillRect(0,0,700,320);
  
  c.fillStyle='#cc7bab'; c.fillRect(0,250,700,70);
  c.fillStyle='#f4a5cd'; c.fillRect(0,250,700,5);
  
  let pY = 180 + Math.sin(animTime)*2;
  c.fillStyle='#ff5eaa'; c.beginPath(); c.arc(x,pY,24,0,7); c.fill();
  c.fillStyle='#ffd2b1'; c.beginPath(); c.arc(x,pY-32,16,0,7); c.fill();
  c.fillStyle='#63324f'; c.beginPath(); c.arc(x,pY-38,17,Math.PI,Math.PI*2); c.fill();
  text('ТЫ',x,270,13,'#fff');
  
  let bx=520, by=170 + Math.cos(animTime)*3;
  drawBoss(bx, by, currentBossIndex);
  text(bosses[currentBossIndex].name.toUpperCase(), bx, 270, 13, '#fff');
  
  particles=particles.filter(p=>p.life-->0);
  for(const p of particles){
    p.x+=p.vx; p.y+=p.vy;
    c.globalAlpha=Math.max(0,p.life/40);
    text(p.s,p.x,p.y,16,'#fff');
    c.globalAlpha=1;
  }

  floatingTexts=floatingTexts.filter(ft=>ft.life-->0);
  for(const ft of floatingTexts){
    ft.y-=0.7;
    c.globalAlpha=Math.max(0,ft.life/30);
    text(ft.text, ft.x, ft.y, 18, ft.color);
    c.globalAlpha=1;
  }
  
  c.restore();
}

function loop(){
  if($('battle').classList.contains('active')){
    draw();
    requestAnimationFrame(loop);
  }
}

document.addEventListener('keydown',e=>{
  if(!$('battle').classList.contains('active'))return;
  if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')move(-1);
  if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')move(1);
  if(e.code==='Space'){e.preventDefault();hit();}
});
</script>
</body>
</html>
